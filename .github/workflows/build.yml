name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  TD_TAG: v1.8.0
  OPENSSL_TAG: master
  NDK_VERSION: 26.1.10909125
  ANDROID_PLATFORM: android-24

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: Checkout TDLib source
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ env.TD_TAG }}
          path: td-src

      - name: Checkout prebuilt OpenSSL for Android
        uses: actions/checkout@v4
        with:
          repository: gcesarmza/android-openssl
          path: android-openssl

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Build TDLib JNI library for all ABIs
        run: |
          set -e
          cd td-src
          mkdir -p build
          OPENSSL_DIR="$GITHUB_WORKSPACE/android-openssl"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "=== Building for $ABI ==="
            BUILD_DIR="build/$ABI"
            mkdir -p "$BUILD_DIR"
            cmake -B "$BUILD_DIR" -S . \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM="${{ env.ANDROID_PLATFORM }}" \
              -DOPENSSL_ROOT_DIR="$OPENSSL_DIR/$ABI" \
              -DOPENSSL_INCLUDE_DIR="$OPENSSL_DIR/include" \
              -DTD_ENABLE_JNI=ON
            cmake --build "$BUILD_DIR" --target tdjni -- -j"$(nproc)"
          done

      - name: Collect native libraries into app module
        run: |
          set -e
          mkdir -p app-repo/app/src/main/jniLibs/armeabi-v7a
          mkdir -p app-repo/app/src/main/jniLibs/arm64-v8a
          mkdir -p app-repo/app/src/main/jniLibs/x86
          mkdir -p app-repo/app/src/main/jniLibs/x86_64
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            SO_FILE=$(find "td-src/build/$ABI" -name "libtdjni.so" | head -n 1)
            if [ -z "$SO_FILE" ]; then
              echo "::error::libtdjni.so not found for $ABI"
              exit 1
            fi
            cp "$SO_FILE" "app-repo/app/src/main/jniLibs/$ABI/libtdjni.so"
          done

      - name: Collect generated Java bindings (TdApi.java, Client.java)
        run: |
          set -e
          DEST="app-repo/app/src/main/java/org/drinkless/tdlib"
          mkdir -p "$DEST"
          TDAPI_FILE=$(find td-src/build -name "TdApi.java" | head -n 1)
          CLIENT_FILE=$(find td-src -name "Client.java" | head -n 1)
          if [ -z "$TDAPI_FILE" ]; then
            echo "::error::TdApi.java not found — проверь версию TD_TAG / путь генерации"
            exit 1
          fi
          cp "$TDAPI_FILE" "$DEST/TdApi.java"
          cp "$CLIENT_FILE" "$DEST/Client.java"

      - name: Set up Gradle wrapper
        working-directory: app-repo
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: app-repo
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-repo/app/build/outputs/apk/debug/app-debug.apk

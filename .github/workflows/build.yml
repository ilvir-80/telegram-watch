name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: Checkout TDLib source (full, needs example/android/Dockerfile)
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          path: td-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Официальный способ сборки TDLib под Android: Dockerfile из
      # td/example/android сам скачивает Android SDK/NDK, собирает OpenSSL
      # и саму TDLib, и кладёт результат в ./tdlib (см.
      # https://github.com/tdlib/td/blob/master/example/android/README.md)
      - name: Build TDLib for Android via official Docker script
        working-directory: td-src/example/android
        run: |
          set -e
          docker build --output tdlib .
          echo "=== contents of tdlib/ output ==="
          find tdlib -maxdepth 4 | head -100

      - name: Collect native libraries into app module
        run: |
          set -e
          DEST_BASE="app-repo/app/src/main/jniLibs"
          mkdir -p "$DEST_BASE"/armeabi-v7a "$DEST_BASE"/arm64-v8a "$DEST_BASE"/x86 "$DEST_BASE"/x86_64
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            SO_FILE=$(find td-src/example/android/tdlib -ipath "*$ABI*libtdjni.so" | head -n 1)
            if [ -z "$SO_FILE" ]; then
              echo "::error::libtdjni.so not found for $ABI — смотри вывод предыдущего шага 'find tdlib'"
              exit 1
            fi
            cp "$SO_FILE" "$DEST_BASE/$ABI/libtdjni.so"
            echo "OK $ABI -> $SO_FILE"
          done

      - name: Collect generated Java bindings (TdApi.java, Client.java)
        run: |
          set -e
          DEST="app-repo/app/src/main/java/org/drinkless/tdlib"
          mkdir -p "$DEST"
          TDAPI_FILE=$(find td-src/example/android/tdlib -name "TdApi.java" | head -n 1)
          CLIENT_FILE=$(find td-src/example/android/tdlib -name "Client.java" | head -n 1)
          if [ -z "$TDAPI_FILE" ] || [ -z "$CLIENT_FILE" ]; then
            echo "::error::TdApi.java/Client.java не найдены — смотри вывод предыдущего шага 'find tdlib'"
            exit 1
          fi
          cp "$TDAPI_FILE" "$DEST/TdApi.java"
          cp "$CLIENT_FILE" "$DEST/Client.java"

      - name: Set up Gradle wrapper
        working-directory: app-repo
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: app-repo
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-repo/app/build/outputs/apk/debug/app-debug.apk
